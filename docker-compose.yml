services:
  mongo:
    image: mongo:7
    container_name: dink-mongo
    ports:
      - "27017:27017"
    volumes:
      - dink_mongo_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 10

  mongo-express:
    image: mongo-express:1
    container_name: dink-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    profiles:
      - tools

volumes:
  dink_mongo_data:
